<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    [attr.role]="isHandset() ? 'dialog' : 'navigation'"
    [mode]="isHandset() ? 'over' : 'side'"
    [(opened)]="opened"
    aria-label="Side navigation"
    class="sidenav"
    fixedInViewport="true"
  >
    <mat-toolbar class="sidenav-toolbar" color="primary">
      <app-server-status />
    </mat-toolbar>
    <mat-nav-list aria-label="Main navigation">
      @if (isLoggedIn()) {
        @if (hasRole('admin')) {
          <a mat-list-item routerLink="/admin">Admin</a>
        }
        <a mat-list-item routerLink="/secret-dashboard">Secret dashboard</a>
        <a mat-list-item routerLink="/auth/logout">Logout</a>
      } @else {
        <a mat-list-item routerLink="/auth">Auth</a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button (click)="toggle()" aria-label="Toggle sidenav" mat-icon-button type="button">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
      <a routerLink="/">ng-material-scaffold</a>
    </mat-toolbar>
    <ng-content />
  </mat-sidenav-content>
</mat-sidenav-container>
